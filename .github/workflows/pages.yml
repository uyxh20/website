name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  fix-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use relative asset paths
        run: |
          python3 -c "from pathlib import Path; p=Path('public/site.html'); t=p.read_text().replace('/webflow/','webflow/').replace('src=\"/portfolio.html\"','src=\"portfolio.html\"'); p.write_text(t)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/site.html
          if git diff --cached --quiet; then
            echo "paths already relative"
          else
            git commit -m "Use relative webflow and portfolio paths for GitHub Pages."
            git push
          fi

  probe:
    needs: fix-paths
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.probe.outputs.ok }}
    steps:
      - id: probe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          get_code=$(curl -sS -o /tmp/pages-get.json -w '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          echo "GET /pages -> ${get_code}"
          cat /tmp/pages-get.json
          echo
          if [ "${get_code}" = "200" ]; then
            echo "ok=true" >> "${GITHUB_OUTPUT}"
          else
            echo "ok=false" >> "${GITHUB_OUTPUT}"
            echo "Pages is not enabled. GITHUB_TOKEN cannot create a Pages site (needs repo admin). Repo should be public. Enable Settings → Pages → GitHub Actions, then re-run this workflow."
          fi

  deploy:
    needs: probe
    if: needs.probe.outputs.ok == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp -a public/. _site/
          python3 -c "from pathlib import Path; p=Path('_site/site.html'); t=p.read_text().replace('/webflow/','webflow/').replace('src=\"/portfolio.html\"','src=\"portfolio.html\"'); p.write_text(t); Path('_site/index.html').write_text(t); print('prepared index.html', len(t), 'bytes')"
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
