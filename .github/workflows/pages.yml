# Deploy GitHub Pages from public/ on every push to main.
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp -a public/. _site/
          python3 -c "from pathlib import Path; p=Path('_site/site.html'); t=p.read_text().replace('/webflow/','webflow/').replace('src=\"/portfolio.html\"','src=\"portfolio.html\"'); p.write_text(t); Path('_site/index.html').write_text(t); print('prepared index.html', len(t), 'bytes')"
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
