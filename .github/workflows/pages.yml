name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.probe.outputs.ok }}
    steps:
      - id: probe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          post_code=$(curl -sS -o /tmp/pages-post.json -w '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            -d '{"build_type":"workflow"}')
          echo "POST /pages -> ${post_code}"
          cat /tmp/pages-post.json
          echo
          get_code=$(curl -sS -o /tmp/pages-get.json -w '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          echo "GET /pages -> ${get_code}"
          cat /tmp/pages-get.json
          echo
          if [ "${post_code}" = "201" ] || [ "${post_code}" = "409" ] || [ "${get_code}" = "200" ]; then
            echo "ok=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "ok=false" >> "${GITHUB_OUTPUT}"
          existing=$(gh issue list --state all --search "[pages-probe]" --json number --jq 'length')
          if [ "${existing}" = "0" ]; then
            gh issue create \
              --title "[pages-probe] GitHub Pages blocked on private repo" \
              --body "Repo remains private. Do not change visibility.\n\nPOST /pages HTTP ${post_code}\n$(cat /tmp/pages-post.json)\n\nGET /pages HTTP ${get_code}\n$(cat /tmp/pages-get.json)"
          fi
          exit 0

  deploy:
    needs: probe
    if: needs.probe.outputs.ok == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp -a public/. _site/
          python3 -c "from pathlib import Path; p=Path('_site/site.html'); t=p.read_text().replace('/webflow/','webflow/').replace('src=\"/portfolio.html\"','src=\"portfolio.html\"').replace(\"src='/portfolio.html'\",\"src='portfolio.html'\"); p.write_text(t); Path('_site/index.html').write_text(t); print('prepared index.html', len(t), 'bytes')"
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
